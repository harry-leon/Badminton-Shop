server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: identity-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/identity/**
          filters:
            - StripPrefix=0
        - id: catalog-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/catalog/**
        - id: inventory-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/inventory/**
        - id: order-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/orders/**
        - id: secondhand-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/secondhand/**
        - id: warranty-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/warranty/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{correlationId:-}]"
