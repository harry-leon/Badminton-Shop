services:
  - type: web
    name: badminton-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        value: postgres
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: IMAGEKIT_PUBLIC_KEY
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false
      - key: SPRING_DATA_REDIS_HOST
        value: localhost
      - key: SPRING_DATA_REDIS_PORT
        value: "6379"
      - key: MANAGEMENT_HEALTH_REDIS_ENABLED
        value: "false"
      - key: JAVA_OPTS
        value: "-XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xms128m -Xmx384m -XX:+ExitOnOutOfMemoryError"
